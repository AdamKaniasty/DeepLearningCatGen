model: dcgan
seed: 42
max_epochs: 80
save_every: 5
tags:
- phase128
- extension
- mixed
data:
  image_size: 128
  num_workers: 4
  augment: true
  augment_crop: true
  split: mixed_train_800.txt
  batch_size: 32
model_args:
  z_dim: 128
  ch: 64
  image_size: 128
  lr: 0.0001
  lr_d: 0.0002
  beta1: 0.5
  label_smooth: 0.1
  generator: upsample_conv
  n_sample: 64
