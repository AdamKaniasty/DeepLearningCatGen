model: vqvae
seed: 42
max_epochs: 80
tags:
- refine
data:
  split: train_1500.txt
  image_size: 64
  batch_size: 32
  num_workers: 4
  augment: true
model_args:
  num_embeddings: 128
  embedding_dim: 64
  hidden: 128
  lr: 0.0002
early_stop:
  monitor: recon
  patience: 10
  min_delta: 0.0001
  mode: min
